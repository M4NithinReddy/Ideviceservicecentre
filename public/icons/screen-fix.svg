<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Phone body -->
  <rect x="17" y="7" width="30" height="50" rx="6" fill="#0d1525" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Screen -->
  <rect x="20" y="13" width="24" height="36" rx="3" fill="#0a1020"/>
  <!-- Crack lines -->
  <line x1="20" y1="13" x2="38" y2="40" stroke="#93c5fd" stroke-width="1" opacity="0.7"/>
  <line x1="38" y1="13" x2="26" y2="30" stroke="#93c5fd" stroke-width="0.8" opacity="0.5"/>
  <line x1="26" y1="30" x2="32" y2="49" stroke="#93c5fd" stroke-width="0.8" opacity="0.5"/>
  <!-- Repair glow -->
  <ellipse cx="29" cy="31" rx="6" ry="8" fill="#3b82f6" opacity="0.15" filter="url(#glow)"/>
  <!-- Home indicator -->
  <rect x="27" y="52" width="10" height="2" rx="1" fill="#3b82f6" opacity="0.5"/>
  <!-- Notch -->
  <rect x="25" y="7" width="14" height="4" rx="2" fill="#3b82f6" opacity="0.2"/>
  <circle cx="32" cy="9" r="1.5" fill="#3b82f6" opacity="0.6"/>
  <!-- Side buttons -->
  <rect x="47" y="18" width="2" height="8" rx="1" fill="#3b82f6" opacity="0.5"/>
  <rect x="15" y="20" width="2" height="5" rx="1" fill="#3b82f6" opacity="0.4"/>
  <rect x="15" y="27" width="2" height="5" rx="1" fill="#3b82f6" opacity="0.4"/>
</svg>
