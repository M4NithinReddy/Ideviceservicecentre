<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#071a0a"/>
      <stop offset="100%" stop-color="#040f06"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Battery body -->
  <rect x="10" y="20" width="40" height="24" rx="5" fill="#0a1a0c" stroke="#22c55e" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Battery terminal -->
  <rect x="50" y="26" width="5" height="12" rx="2" fill="#22c55e" opacity="0.6"/>
  <!-- Fill level (80%) -->
  <rect x="13" y="23" width="29" height="18" rx="3" fill="#22c55e" opacity="0.8" filter="url(#glow)"/>
  <!-- Shine -->
  <rect x="13" y="23" width="29" height="6" rx="3" fill="white" opacity="0.08"/>
  <!-- Lightning bolt overlay -->
  <path d="M34 22 L28 33 L32 33 L30 42 L36 31 L32 31 Z" fill="white" opacity="0.9"/>
  <!-- Percentage marker lines -->
  <line x1="23" y1="23" x2="23" y2="41" stroke="white" stroke-width="0.5" opacity="0.2"/>
  <line x1="32" y1="23" x2="32" y2="41" stroke="white" stroke-width="0.5" opacity="0.2"/>
</svg>
