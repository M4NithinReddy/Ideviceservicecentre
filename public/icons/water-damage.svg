  <path d="M32 14 C32 14 20 28 20 36 a12 12 0 0 0 24 0 C44 28 32 14 32 14Z" fill="#06b6d4" opacity="0.25" filter="url(#glow)"/>
  <path d="M32 14 C32 14 20 28 20 36 a12 12 0 0 0 24 0 C44 28 32 14 32 14Z" fill="none" stroke="#06b6d4" stroke-width="1.5" filter="url(#glow)"/>
