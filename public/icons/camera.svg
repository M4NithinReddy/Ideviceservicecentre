<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#120a1c"/>
      <stop offset="100%" stop-color="#0a0512"/>
    </radialGradient>
    <radialGradient id="lens" cx="40%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#2a1540"/>
      <stop offset="100%" stop-color="#0f0820"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Camera bump -->
  <rect x="11" y="11" width="42" height="42" rx="10" fill="#140c24" stroke="#a855f7" stroke-width="1.2" opacity="0.7"/>
  <!-- Main lens ring -->
  <circle cx="32" cy="32" r="16" fill="url(#lens)" stroke="#a855f7" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Inner lens rings -->
  <circle cx="32" cy="32" r="12" fill="none" stroke="#a855f7" stroke-width="0.8" opacity="0.5"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#a855f7" stroke-width="0.6" opacity="0.7"/>
  <!-- Lens center -->
  <circle cx="32" cy="32" r="5" fill="#1a0d30" stroke="#c084fc" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="2.5" fill="#a855f7" opacity="0.7" filter="url(#glow)"/>
  <!-- Lens reflection -->
  <ellipse cx="27" cy="27" rx="3" ry="2" fill="white" opacity="0.1" transform="rotate(-30 27 27)"/>
  <!-- Small sensor dots -->
  <circle cx="48" cy="16" r="2.5" fill="#a855f7" opacity="0.6"/>
  <circle cx="48" cy="22" r="1.5" fill="#c084fc" opacity="0.5"/>
  <circle cx="42" cy="16" r="1.8" fill="#a855f7" opacity="0.4"/>
</svg>
