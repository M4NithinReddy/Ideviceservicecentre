<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#041a14"/>
      <stop offset="100%" stop-color="#020f0b"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Shield body -->
  <path d="M32 10 L52 18 L52 34 C52 44 43 52 32 56 C21 52 12 44 12 34 L12 18 Z" fill="#041a14" stroke="#14b8a6" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Shield inner glow -->
  <path d="M32 14 L48 21 L48 34 C48 42 41 49 32 52 C23 49 16 42 16 34 L16 21 Z" fill="#14b8a6" opacity="0.07"/>
  <!-- Checkmark -->
  <polyline points="23,33 29,40 41,24" fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Star accent top -->
  <circle cx="32" cy="16" r="2" fill="#14b8a6" opacity="0.6" filter="url(#glow)"/>
  <!-- Rim glow dots -->
  <circle cx="14" cy="22" r="1" fill="#14b8a6" opacity="0.4"/>
  <circle cx="50" cy="22" r="1" fill="#14b8a6" opacity="0.4"/>
  <circle cx="12" cy="36" r="1" fill="#14b8a6" opacity="0.3"/>
  <circle cx="52" cy="36" r="1" fill="#14b8a6" opacity="0.3"/>
</svg>
